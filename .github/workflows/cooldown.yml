name: Supply-chain cooldown check

# Reusable workflow + required-workflow target.
#
# Triggered two ways:
#   1. Auto-injected by the org-level Required Workflow ruleset on every
#      PR. This is what makes the check show up as `cooldown-check` on
#      every PR org-wide.
#   2. Called explicitly by another workflow via
#      `uses: Semianalysis/supply-chain-guard/.github/workflows/cooldown.yml@main`
#
# IMPORTANT: do NOT add a `paths:` filter to `pull_request` here. Cross-
# repo Required Workflows do not get a synthetic "Skipped" conclusion
# when the path filter doesn't match — the required check just hangs
# forever as "Expected — Waiting for workflow to run", blocking merges
# on every PR that doesn't touch a dep file. `check.py` already
# short-circuits when no dep files changed (writes a "✅ No dependency
# files changed." summary and exits 0), so it's safe and cheap to run
# the workflow on every PR.

on:
  workflow_call:
    inputs:
      cooldown_days:
        required: false
        type: number
        default: 7
      allowed_scopes:
        required: false
        type: string
        default: "@types"
      override_label:
        required: false
        type: string
        default: "security/cooldown-override"

  pull_request: {}

permissions:
  contents: read
  pull-requests: write   # for posting the finding comment
  issues: write

jobs:
  cooldown-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Run cooldown check
        uses: Semianalysis/supply-chain-guard@main
        with:
          cooldown_days: ${{ inputs.cooldown_days || 7 }}
          allowed_scopes: ${{ inputs.allowed_scopes || '@types' }}
          override_label: ${{ inputs.override_label || 'security/cooldown-override' }}
