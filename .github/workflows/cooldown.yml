name: Supply-chain cooldown check

# Reusable workflow + required-workflow target.
#
# Triggered two ways:
#   1. Auto-injected by the org-level Required Workflow ruleset on every
#      PR matching the dep-file paths below. This is what makes the
#      check show up as `cooldown-check` on every PR org-wide.
#   2. Called explicitly by another workflow via
#      `uses: Semianalysis/supply-chain-guard/.github/workflows/cooldown.yml@main`
#
# The `pull_request` trigger is REQUIRED for the ruleset to inject the
# workflow. Dropping it makes GitHub mark the rule as "Workflow
# configuration invalid" and no cooldown-check runs at all.

on:
  workflow_call:
    inputs:
      cooldown_days:
        required: false
        type: number
        default: 7
      allowed_scopes:
        required: false
        type: string
        default: "@types"
      override_label:
        required: false
        type: string
        default: "security/cooldown-override"

  pull_request:
    paths:
      - "**/package-lock.json"
      - "**/package.json"
      - "**/yarn.lock"
      - "**/pnpm-lock.yaml"
      - "**/requirements*.txt"
      - "**/pyproject.toml"
      - "**/Pipfile.lock"
      - "**/poetry.lock"
      - "**/uv.lock"

permissions:
  contents: read
  pull-requests: write   # for posting the finding comment
  issues: write

jobs:
  cooldown-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Run cooldown check
        uses: Semianalysis/supply-chain-guard@main
        with:
          cooldown_days: ${{ inputs.cooldown_days || 7 }}
          allowed_scopes: ${{ inputs.allowed_scopes || '@types' }}
          override_label: ${{ inputs.override_label || 'security/cooldown-override' }}
