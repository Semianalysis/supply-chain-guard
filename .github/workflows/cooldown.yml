name: Supply-chain cooldown check

# Reusable workflow. Called by other repos either:
#   1. Explicitly: `uses: Semianalysis/supply-chain-guard/.github/workflows/cooldown.yml@main`
#   2. Or via the org-level Required Workflow ruleset (Mini Shai-Hulud guard).
#
# Supply-chain-guard itself is excluded from the ruleset; check.py changes are
# gated by self-test.yml (pytest) rather than by this workflow.

on:
  workflow_call:
    inputs:
      cooldown_days:
        required: false
        type: number
        default: 7
      allowed_scopes:
        required: false
        type: string
        default: "@types"
      override_label:
        required: false
        type: string
        default: "security/cooldown-override"

permissions:
  contents: read
  pull-requests: write   # for posting the finding comment
  issues: write

jobs:
  cooldown-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Run cooldown check
        uses: Semianalysis/supply-chain-guard@main
        with:
          cooldown_days: ${{ inputs.cooldown_days }}
          allowed_scopes: ${{ inputs.allowed_scopes }}
          override_label: ${{ inputs.override_label }}
