name: Supply-chain cooldown check

# Reusable workflow. Either:
#   1. Called by other repos via `uses: Semianalysis/supply-chain-guard/.github/workflows/cooldown.yml@main`
#   2. Or configured as an org-level Required Workflow pointing at this file.

on:
  workflow_call:
    inputs:
      cooldown_days:
        required: false
        type: number
        default: 7
      allowed_scopes:
        required: false
        type: string
        default: "@types"
      override_label:
        required: false
        type: string
        default: "security/cooldown-override"

  # Runs on every PR. The check script short-circuits when no dep files
  # changed (so non-dep PRs cost ~5 seconds of CI). We CANNOT use a paths
  # filter here because this is wired as a required check via an org-level
  # ruleset; if the workflow doesn't trigger, the required check sits at
  # "Expected — Waiting for" forever and blocks merges.
  pull_request:

permissions:
  contents: read
  pull-requests: write   # for posting the finding comment
  issues: write

jobs:
  cooldown-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run cooldown check
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          COOLDOWN_DAYS: ${{ inputs.cooldown_days || 7 }}
          ALLOWED_SCOPES: ${{ inputs.allowed_scopes || '@types' }}
          OVERRIDE_LABEL: ${{ inputs.override_label || 'security/cooldown-override' }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO_FULL: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Pull the check script from this central repo and run it.
          # Repo dispatches just need to call this workflow.
          curl -sSfL https://raw.githubusercontent.com/Semianalysis/supply-chain-guard/main/check.py -o /tmp/cooldown_check.py
          python /tmp/cooldown_check.py
